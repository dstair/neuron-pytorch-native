# Pika-H3-Flex long-form (up to 15 s / 362 frames) on a trn2.48xlarge: TP=8 x CP=2 (16 cores).
# The 92-latent-frame sequence OOMs a plain TP=8 block graph (34.6 GB peak > 24 GB/core);
# ring_degree=2 shards the sequence so each rank holds ~46k rows (~17 GB peak).
# compile_vae_encoder stays on for keyframe conditioning (short sequences still benefit).
stages:
  - stage_id: 0
    max_num_seqs: 1
    runtime:
      devices: "0-15"
    engine_args:
      model_class_name: MiniMaxH3ModularPipeline
      dtype: bfloat16
      vae_use_tiling: true
      model_config:
        pika_lora_path: /data/models/Pika-H3-Flex/fl2va/adapter.safetensors
        pika_renoise: true
        compile_vae_encoder: true
        adaln_on_host: true
        compile_per_block: true
        rope_by_matmul: true
        attention_heads_per_call: 2
        adaln_cache: true
        text_encoder_stream_layers: 4
        vae_swap_dit_blocks: 25
        vae_fused_vit: true
        host_weights_dir: /data/nvme/minimax_h3
      parallel_config:
        tensor_parallel_size: 8
        ring_degree: 2
        cfg_parallel_size: 1
        vae_patch_parallel_size: 16
