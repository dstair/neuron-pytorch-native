# Pika-H3-Flex on a trn2.48xlarge: TP=8 "fast" variant — no host swaps.
# At TP=8 the per-rank DiT (~8.3 GB), text encoder (~8 GB) and VAE (~4.9 GB) nominally fit
# in 24 GB/core, so the text-encoder streaming and the VAE/DiT block swap can come off:
# text encode and VAE decode lose their per-request host round-trips.
# If the engine OOMs at load, fall back to pika_h3_flex_stage_tp8.yaml.
stages:
  - stage_id: 0
    max_num_seqs: 1
    runtime:
      devices: "0-7"
    engine_args:
      model_class_name: MiniMaxH3ModularPipeline
      dtype: bfloat16
      vae_use_tiling: true
      model_config:
        pika_lora_path: /data/models/Pika-H3-Flex/fl2va/adapter.safetensors
        pika_renoise: true
        compile_vae_encoder: true
        adaln_on_host: true
        compile_per_block: true
        rope_by_matmul: true
        attention_heads_per_call: 2
        adaln_cache: true
        text_encoder_stream_layers: 0
        vae_swap_dit_blocks: 0
        vae_fused_vit: true
        host_weights_dir: /data/nvme/minimax_h3
      parallel_config:
        tensor_parallel_size: 8
        ring_degree: 1
        cfg_parallel_size: 1
        vae_patch_parallel_size: 8
