# Pika-H3-Flex FL2VA (image-to-video) on one trn2 device.
# Same as pika_h3_flex_stage.yaml but with VAE encoder compilation for keyframes.
#
# FL2VA additions:
#   compile_vae_encoder: true - needed for keyframe encoding
#
stages:
  - stage_id: 0
    max_num_seqs: 1
    runtime:
      devices: "0-3"
    engine_args:
      model_class_name: MiniMaxH3ModularPipeline
      dtype: bfloat16
      vae_use_tiling: true
      model_config:
        pika_lora_path: /data/models/Pika-H3-Flex/fl2va/adapter.safetensors
        pika_renoise: true
        compile_vae_encoder: true
        adaln_on_host: true
        compile_per_block: true
        rope_by_matmul: true
        attention_heads_per_call: 2
        adaln_cache: true
        text_encoder_stream_layers: 4
        vae_swap_dit_blocks: 25
        vae_fused_vit: true
        host_weights_dir: /mnt/nvme/minimax_h3
      parallel_config:
        tensor_parallel_size: 4
        ring_degree: 1
        cfg_parallel_size: 1
        vae_patch_parallel_size: 4
